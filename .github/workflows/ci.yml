name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snipp_test
          POSTGRES_USER: snipp
          POSTGRES_PASSWORD: snipp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snipp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/snipp_test
      SPRING_DATASOURCE_USERNAME: snipp
      SPRING_DATASOURCE_PASSWORD: snipp
      # Test-only signing key; must be at least 32 bytes for HS256
      APP_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t snipp-url:ci .
