name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snipp_test
          POSTGRES_USER: snipp
          POSTGRES_PASSWORD: snipp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snipp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/snipp_test
      SPRING_DATASOURCE_USERNAME: snipp
      SPRING_DATASOURCE_PASSWORD: snipp
      # Test-only signing key; must be at least 32 bytes for HS256
      APP_JWT_SECRET: ci-test-secret-0123456789abcdef0123456789
      # Enables RedisIntegrationTests (the app itself defaults to APP_REDIS_ENABLED=false)
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Build Docker image
        run: docker build -t snipp-url:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL -e SPRING_DATASOURCE_USERNAME -e SPRING_DATASOURCE_PASSWORD -e APP_JWT_SECRET \
            snipp-url:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health | grep -q '"UP"'
          # Must not run as root
          test "$(docker exec app id -u)" != "0"
          # Docker HEALTHCHECK must report healthy
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          echo "health: $status"
          [ "$status" = "healthy" ]

      - name: Show container logs
        if: failure()
        run: docker logs app || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The whole stack exactly as a new contributor runs it: `docker compose up --build`,
  # then a real browser signs up, shortens, follows, checks stats, edits and deletes.
  e2e:
    runs-on: ubuntu-latest
    env:
      APP_JWT_SECRET: ci-e2e-secret-0123456789abcdef0123456789
      # The suite signs up and logs in several times within a minute from one address
      APP_RATE_LIMIT_AUTH_PER_MINUTE: 100
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check the stack through the web container
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/api/health | grep -q '"UP"'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
