# ===============================
# Application
# ===============================
spring.application.name=urlShortenerb
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

# ===============================
# Datasource (Render / Cloud)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only
# checks that the entities match it. Override with JPA_DDL_AUTO if ever needed.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Databases created before Flyway was introduced are baselined at V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# HikariCP (Connection Pool)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JWT Configuration
# ===============================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS
# ===============================
# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://url-shortenerf.vercel.app,https://urlshortenerf.vercel.app,https://url-shortenerf-2rosroi2s-yato561s-projects.vercel.app}

# ===============================
# Rate limiting (requests per minute per client IP)
# ===============================
app.rate-limit.auth-per-minute=${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.create-per-minute=${APP_RATE_LIMIT_CREATE_PER_MINUTE:30}
# Use the client IP from X-Forwarded-For when behind a trusted proxy (e.g. Render)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}


# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.com.yato.urlShortenerb=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===============================
# Actuator (health only)
# ===============================
# Served at /api/health (plus /api/health/liveness and /api/health/readiness);
# returns 503 when the database is unreachable
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
