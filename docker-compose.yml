# Local development: Postgres + the app.
#   cp .env.example .env   # set APP_JWT_SECRET
#   docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: snipp
      POSTGRES_USER: snipp
      POSTGRES_PASSWORD: snipp
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snipp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/snipp
      SPRING_DATASOURCE_USERNAME: snipp
      SPRING_DATASOURCE_PASSWORD: snipp
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env (at least 32 characters)}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}

volumes:
  db-data:
